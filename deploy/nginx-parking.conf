# Reverse proxy for the Streamlit dashboard.
# Copy to /etc/nginx/sites-available/parking, symlink into sites-enabled, reload nginx.
# The Upgrade/Connection headers are REQUIRED — Streamlit uses a WebSocket; without
# them the page loads then hangs on "Connecting...".
server {
    listen 80;
    server_name _;            # replace _ with your domain (e.g. parking.example.com)

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
